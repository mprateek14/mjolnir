<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Screener</title>
<style>
  :root { --bg: #0f1115; --surface: #151820; --raised: #1b1f2a; --line: #242936; --text: #dfe3ec; --dim: #8b93a5; --faint: #5b6376; --accent: #5b8cff; --accent-dim: #2a3d6e; --ok: #3fb97f; --err: #e5605a; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  .page { height: 100%; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .t { font-weight: 600; font-size: 15px; }
  .m { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 1px; }
  .tile b { font-size: 20px; font-weight: 600; }
  .tile span { color: var(--text); }
  .tile small { color: var(--faint); font-size: 11px; }
  label { display: grid; gap: 4px; color: var(--dim); font-size: 12px; min-width: 0; }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  input:not([type=checkbox]) { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; color: var(--text); outline: none; width: 100%; font: inherit; }
  input:focus { border-color: var(--accent); }
  .pick { display: flex; gap: 6px; }
  .hint { color: var(--faint); font-size: 11px; }
  .btn { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--text); font: inherit; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--raised); border-color: var(--line); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #6f9aff; border-color: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { margin-top: auto; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .msg { color: var(--dim); }
  .msg.bad { color: var(--err); }
  details summary { cursor: pointer; color: var(--dim); }
  details summary:hover { color: var(--text); }
  .list { margin-top: 6px; max-height: 118px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); user-select: text; }
  .sec-name { position: sticky; top: 0; background: var(--raised); color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 10px; border-top: 1px solid #1a1e29; }
  .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tag { color: var(--faint); font-size: 11px; flex: none; }
  [hidden] { display: none !important; }
  .center { margin: auto 0; display: grid; gap: 10px; }
</style>
</head>
<body>
<div class="page">
  <div class="center" id="state"><div class="msg" id="stateMsg">Loading the screener.in page…</div></div>

  <div id="main" hidden style="display:contents">
    <div>
      <div class="t" id="title"></div>
      <div class="m" id="sub"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <details id="files">
      <summary id="filesSum">Files</summary>
      <div class="list" id="list"></div>
    </details>
    <label>Save to
      <div class="pick"><input id="dir" spellcheck="false"><button class="btn" id="browse">Change</button></div>
      <span class="hint" id="where"></span>
    </label>
    <label class="check"><input type="checkbox" id="force"> Download again, even files already saved</label>
    <div class="actions">
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn primary" id="go">Start download</button>
    </div>
  </div>
</div>
<script src="capture.js"></script>
</body>
</html>
