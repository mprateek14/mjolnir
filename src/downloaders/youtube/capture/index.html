<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com">
<title>YouTube</title>
<style>
  :root { --bg: #0f1115; --surface: #151820; --raised: #1b1f2a; --line: #242936; --text: #dfe3ec; --dim: #8b93a5; --faint: #5b6376; --accent: #5b8cff; --accent-dim: #2a3d6e; --ok: #3fb97f; --err: #e5605a; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  .page { height: 100%; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; gap: 12px; }
  .head img { width: 128px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--raised); flex: none; }
  .t { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .m { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .row { display: flex; gap: 10px; }
  label { display: grid; gap: 4px; color: var(--dim); font-size: 12px; min-width: 0; }
  .row label { flex: 1; }
  select, input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; color: var(--text); outline: none; width: 100%; font: inherit; }
  select:focus, input:focus { border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; align-self: flex-start; }
  .seg button { background: transparent; border: 0; color: var(--dim); padding: 5px 14px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent-dim); color: var(--text); }
  .pick { display: flex; gap: 6px; }
  .btn { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--text); font: inherit; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--raised); border-color: var(--line); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #6f9aff; border-color: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  .grow { flex: 1; }
  .actions { margin-top: auto; display: flex; align-items: center; gap: 8px; }
  .size { color: var(--dim); font-size: 12px; margin-right: auto; }
  .msg { color: var(--dim); }
  .msg.bad { color: var(--err); }
  .bar { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  [hidden] { display: none !important; }
  .center { margin: auto 0; display: grid; gap: 10px; }
</style>
</head>
<body>
<div class="page">
  <div class="center" id="state">
    <div class="msg" id="stateMsg">Asking YouTube for the available formats…</div>
    <div class="bar" id="installBar" hidden><i></i></div>
    <div><button class="btn primary" id="btnInstall" hidden>Download engine</button></div>
  </div>

  <div id="main" hidden style="display:contents">
    <div class="head">
      <img id="thumb" alt="">
      <div style="min-width:0">
        <div class="t" id="title"></div>
        <div class="m" id="meta"></div>
      </div>
    </div>

    <div class="seg" id="modeSeg"><button data-m="video" class="on">Video</button><button data-m="audio">Audio only</button></div>

    <div class="row" id="vRow">
      <label class="grow" style="flex:2">Quality <select id="qual"></select></label>
      <label>Format <select id="cont"><option value="compat">MP4</option><option value="best">MKV</option></select></label>
    </div>
    <div class="row" id="aRow" hidden>
      <label>Audio format <select id="aud"><option value="mp3">MP3</option><option value="m4a">M4A (AAC)</option><option value="opus">Opus</option></select></label>
    </div>

    <label>Save to
      <div class="pick"><input id="dir" spellcheck="false"><button class="btn" id="browse">Change</button></div>
    </label>

    <div class="actions">
      <span class="size" id="size"></span>
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn primary" id="go">Start download</button>
    </div>
  </div>
</div>
<script src="capture.js"></script>
</body>
</html>
