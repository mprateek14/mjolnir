<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>File info</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="../ui/style.css">
<style>
  body { overflow: hidden; }
  .dlg { padding: 18px 20px; height: 100%; align-content: start; }
  .actions { margin-top: auto; }
  .capline { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .badge { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px; border: 1px solid; }
  #capLine.bad { color: var(--err); }
  .badge.ok { color: var(--ok); background: #3fb97f1f; border-color: #3fb97f55; }
  .badge.bad { color: var(--err); background: #e5605a1f; border-color: #e5605a55; }
  .wrap { height: 100vh; display: grid; grid-template-rows: 1fr; }
</style>
</head>
<body>
<div class="wrap">
  <div class="dlg">
    <div class="capinfo">
      <div class="captype" id="capType">FILE</div>
      <div class="capmeta">
        <div class="capname" id="capName"></div>
        <div class="capline"><span id="capLine">Checking link…</span><span id="capBadge" class="badge" hidden></span></div>
        <div class="capurl" id="capUrl"></div>
      </div>
    </div>
    <label>Save as <input id="capFile" spellcheck="false"></label>
    <label>Save to
      <div class="pick"><input id="capDir" spellcheck="false"><button type="button" class="btn" id="capBrowse">Change</button></div>
    </label>
    <div class="actions">
      <button type="button" class="btn" id="capCancel">Cancel</button>
      <button type="button" class="btn" id="capLater">Download later</button>
      <button type="button" class="btn primary" id="capGo">Start download</button>
    </div>
  </div>
</div>
<script src="capture.js"></script>
</body>
</html>
