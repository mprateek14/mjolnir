<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mjolnir</title>
<style>
  :root { --bg: #0f1115; --surface: #151820; --raised: #1b1f2a; --line: #242936; --text: #dfe3ec; --dim: #8b93a5; --faint: #5b6376; --accent: #5b8cff; --ok: #3fb97f; --err: #e5605a; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 320px; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header img { width: 26px; height: 26px; border-radius: 6px; }
  header b { font-size: 14px; }
  .state { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); }
  section { padding: 14px; display: grid; gap: 10px; }
  .hint { color: var(--dim); font-size: 12px; }
  .btn { background: var(--raised); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 12px; font: inherit; cursor: pointer; text-align: center; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0a0f1d; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: #7aa1ff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .msg { font-size: 12px; min-height: 16px; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--err); }
</style>
</head>
<body>
<header>
  <img src="icons/48.png" alt="">
  <b>Mjolnir</b>
  <span class="state" id="state" hidden><span class="dot" id="dot"></span><span id="stateText"></span></span>
</header>
<section>
  <button class="btn primary" id="go" disabled>Download from this page</button>
  <div class="hint" id="goHint">Checking…</div>
  <div class="msg" id="goMsg"></div>
</section>
<script src="popup.js"></script>
</body>
</html>
